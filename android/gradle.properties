# -Xmx8G previously here exceeded total physical RAM on a 7G dev machine outright,
# crashing the Gradle daemon with a native OOM (Chunk::new alloc failure) after ~25min —
# confirmed via the daemon's own hs_err_pid log, not assumed. -Xmx4G leaves headroom for
# the OS/IDE/emulator on a 7-8G machine while still building successfully (verified: a
# -Xmx3G build completed assembleDebug in ~317s with the same plugin set).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=384m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
